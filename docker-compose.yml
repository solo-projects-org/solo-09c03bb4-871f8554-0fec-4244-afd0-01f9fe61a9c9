services:
  web:
    build: .
    image: bus-survey:latest
    ports:
      - "8000:8000"
    mem_limit: 384m
    mem_reservation: 256m
    cpus: 2
    volumes:
      - duckdb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  duckdb_data:
